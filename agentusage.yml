name: AgentUsage
options:
  bundleIdPrefix: dev.agus
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AgentUsage:
    type: application
    platform: macOS
    sources:
      - path: Sources/AgentUsage
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Agent Usage
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
    entitlements:
      path: AgentUsage.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agus.AgentUsage
        PRODUCT_NAME: AgentUsage
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
