name: AgentUsage
options:
  bundleIdPrefix: dev.agus
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  AgentUsage:
    type: application
    platform: macOS
    sources:
      - path: Sources/AgentUsage
      - path: Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Agent Usage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
    entitlements:
      path: AgentUsage.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agus.AgentUsage
        PRODUCT_NAME: AgentUsage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
  AgentUsageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AgentUsageTests
    dependencies:
      - target: AgentUsage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agus.AgentUsageTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  AgentUsage:
    build:
      targets:
        AgentUsage: all
    test:
      targets:
        - AgentUsageTests
